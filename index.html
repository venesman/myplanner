<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Planner</title>
<meta name="theme-color" content="#FBF8F4">
<meta name="description" content="Daily, weekly and monthly planner with productivity and finance tools.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F4; --paper:#fff; --ink:#5B5560; --ink2:#7d7781; --muted:#aaa4ad; --line:#EFE9E6;
  --pink:#F6D6DE; --pinkD:#C46F87; --peach:#F9DDC9; --peachD:#C27E52;
  --yellow:#FAEDB9; --yellowD:#A98A25; --mint:#CFEBDD; --mintD:#4F9476;
  --blue:#D3E3F3; --blueD:#557FAA; --lav:#E2D9F1; --lavD:#8470B3;
  --r:16px; --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--safeT) + 8px) 14px calc(var(--safeB) + 96px)}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}
.top h1{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:13px;letter-spacing:.32em;text-transform:uppercase;margin:0;flex:1;color:var(--ink2)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px}
.status{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok{background:var(--mintD)} .status.local{background:var(--peachD)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* paper */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 0 rgba(90,80,90,.03)}
.band{display:flex;align-items:center;justify-content:space-between;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;padding:7px 12px;border-radius:9px;margin:-2px -2px 12px;color:var(--ink)}
.band small{letter-spacing:.05em;font-family:Nunito;font-weight:600;text-transform:none;font-size:12px;opacity:.75}
.pink{background:var(--pink)} .peach{background:var(--peach)} .yellow{background:var(--yellow)} .mint{background:var(--mint)} .blue{background:var(--blue)} .lav{background:var(--lav)}
.title{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:26px;margin:2px 0 2px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.line-input{width:100%;border:0;border-bottom:1px dashed var(--line);padding:9px 2px;background:transparent;outline:none}
.line-input:focus{border-bottom-color:var(--lavD)}
.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none}
.field:focus{border-color:var(--lavD)}
textarea.field,textarea.line-input{resize:vertical;min-height:84px;line-height:1.5}
textarea.lined{width:100%;border:0;outline:none;resize:vertical;min-height:120px;line-height:30px;padding:0 2px;background:repeating-linear-gradient(transparent,transparent 29px,var(--line) 29px,var(--line) 30px);background-attachment:local}
.prio{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line)}
.prio b{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
/* tasks */
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.chk{flex:none;width:21px;height:21px;border-radius:7px;border:1.6px solid #cfc8cf;display:grid;place-items:center;margin-top:1px}
.chk.on{background:var(--mintD);border-color:var(--mintD)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task .txt{flex:1;min-width:0;text-align:left;word-break:break-word;line-height:1.4}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--ink2);margin:3px 4px 0 0;font-weight:600}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
.p-h{background:var(--pinkD)} .p-m{background:var(--yellowD)} .p-l{background:var(--blueD)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.btn.soft{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:#fff;color:var(--pinkD);border:1px solid var(--pink)}
.btn svg{width:16px;height:16px}
.plus{width:34px;height:34px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.plus svg{width:16px;height:16px}
.linkbtn{color:var(--lavD);font-weight:700;font-size:13px}
/* date nav */
.datenav{display:flex;align-items:center;gap:8px}
.datenav .iconbtn{width:34px;height:34px}
.pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--lav);color:var(--lavD)}
/* segmented */
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--peach);color:var(--ink)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:10.5px;letter-spacing:.14em;text-align:center;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1/1.08;border-radius:10px;border:1px solid var(--line);padding:4px;display:flex;flex-direction:column;align-items:flex-start;font-size:12.5px;background:#fff;text-align:left}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--pinkD);box-shadow:inset 0 0 0 1px var(--pinkD)}
.cal .d .dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap}
.cal .d .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ymon{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left}
.ymon h4{margin:0 0 6px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.ymon .mini{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:8.5px;color:var(--ink2);text-align:center}
.ymon .mini span.t{background:var(--pinkD);color:#fff;border-radius:3px}
.ymon .mini span.has{color:var(--lavD);font-weight:700}
.wday{padding:10px 0;border-bottom:1px dashed var(--line)}
.wday:last-child{border-bottom:0}
.wday h5{margin:0 0 4px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.wday.today h5 span:first-child{color:var(--pinkD)}
.wday .addrow{margin-top:2px}
.wday .addrow input{font-size:13.5px;padding:6px 2px}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.tile .ic svg{width:18px;height:18px}
.tile b{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.tile span{font-size:12.5px;color:var(--muted);margin-top:-6px}
/* list cards */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;text-align:left;display:block;width:100%}
.card h3{margin:0;font-size:15.5px;font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--mintD)}
.bar.over>i{background:var(--pinkD)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px}
.kpi small{display:block;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:16px;font-weight:700;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:30px}
.money-in{color:var(--mintD)} .money-out{color:var(--pinkD)}
.txrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.txrow:last-child{border-bottom:0}
.txrow .cdot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:13px;flex:none}
.daylabel{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.budrow{padding:10px 0;border-bottom:1px dashed var(--line)}
.budrow:last-child{border-bottom:0}
.budrow input{width:96px;text-align:right;border:1px solid var(--line);border-radius:9px;padding:6px 8px;outline:none}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:13.5px}
.back{display:flex;align-items:center;gap:6px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.back svg{width:16px;height:16px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.hour{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line)}
.hour span{width:48px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:12px;color:var(--muted);flex:none}
.hour input{flex:1;border:0;padding:9px 0;outline:none;background:transparent}
/* pomodoro */
.ring{position:relative;width:220px;height:220px;margin:6px auto 12px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:46px;letter-spacing:.04em;display:block}
.ring .t small{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.bars7{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:6px}
.bars7 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars7 i{width:100%;border-radius:6px 6px 3px 3px;background:var(--lav);min-height:3px}
.bars7 span{font-size:10px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;letter-spacing:.1em;color:var(--muted)}
/* bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 10px calc(var(--safeB) + 8px);z-index:20}
nav.bn .in{max-width:560px;margin:0 auto;display:flex;gap:6px}
nav.bn button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:13px;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.bn button svg{width:20px;height:20px}
nav.bn button.on{color:var(--ink)}
nav.bn button.on.t-today{background:var(--pink)} nav.bn button.on.t-cal{background:var(--peach)}
nav.bn button.on.t-plan{background:var(--lav)} nav.bn button.on.t-money{background:var(--mint)} nav.bn button.on.t-life{background:var(--blue)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--safeB) + 86px);width:54px;height:54px;border-radius:18px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(80,70,85,.25);z-index:15}
.fab svg{width:22px;height:22px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(60,50,60,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(var(--safeB) + 18px);animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-weight:500;font-size:13px;letter-spacing:.26em;text-transform:uppercase;margin:4px 0 14px}
.sheet label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.sheet .acts{display:flex;gap:8px;margin-top:18px}
.sheet .acts .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:600}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 150px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;animation:fade .2s}
.spiral{display:flex;justify-content:space-around;margin:-22px 18px 8px}
.spiral i{width:9px;height:16px;border-radius:5px;border:2px solid #d9cfc0;background:var(--bg)}
/* life */
.cups{display:flex;flex-wrap:wrap;gap:6px}
.cup{width:34px;height:40px;border-radius:8px 8px 12px 12px;border:1.5px solid var(--blue);display:grid;place-items:center;color:var(--blue)}
.cup.on{background:var(--blue);border-color:var(--blueD);color:var(--blueD)}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
.c30{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:14px;background:#fff}
.c30.on{background:var(--pink);border-color:var(--pinkD);color:var(--pinkD);font-weight:600}
.c30.now{box-shadow:inset 0 0 0 2px var(--lavD)}
.cal .d.per{background:var(--pinkD);color:#fff;border-color:var(--pinkD)}
.cal .d.pred{background:var(--pink);border-style:dashed;border-color:var(--pinkD)}
.vb{columns:2;column-gap:10px}
.vb-item{display:block;width:100%;break-inside:avoid;margin:0 0 10px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);text-align:left;position:relative}
.vb-item img{display:block;width:100%;height:auto}
.vb-item span{display:block;padding:8px 10px;font-size:13px;font-weight:600}
.vb-load{aspect-ratio:1;background:var(--bg)}
.vb-text{padding:22px 14px;border:0;text-align:center;font-family:Jost,'Century Gothic',Futura,system-ui,sans-serif;font-size:17px;line-height:1.35}
.vb-text q{quotes:none}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;border:1px solid rgba(0,0,0,.08)}
.toggle{width:50px;height:30px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:.2s}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--mintD)} .toggle.on i{left:23px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:4px}@keyframes spin{to{transform:rotate(360deg)}}
.sheet .field.filled{box-shadow:0 0 0 3px var(--mint);transition:box-shadow .3s}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bn"><div class="in" id="nav"></div></nav>
<div id="overlay"></div>
<script>
/* ---------- icons ---------- */
const I={
  sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>',
  money:'<rect x="2" y="5" width="20" height="14" rx="3"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9v.01M18 15v.01" stroke-width="3"/>',
  check:'<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  cloud:'<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  card:'<rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/>',
  pie:'<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  bill:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',

const fmtYM=ym=>{const d=P(ym+'-01');return `${MON[d.getMonth()]} ${d.getFullYear()}`};
const daysIn=ym=>{const d=P(ym+'-01');return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};

function monthGrid(ym){
  const first=P(ym+'-01'), lead=(first.getDay()+6)%7, n=daysIn(ym);
  const cells=[];for(let i=0;i<lead;i++)cells.push(null);for(let i=1;i<=n;i++)cells.push(`${ym}-${pad(i)}`);
  while(cells.length%7)cells.push(null);
  return cells;
}

function vPomo(){

      <div class="t"><div><b id="pmTime">${pad(Math.floor(PM.left/60))}:${pad(PM.left%60)}</b><small>${PM.mode==='focus'?'Focus':'Break'}</small></div></div></div>

function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.32)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

/* ---------- sheet (forms) ---------- */
let SHEET=null;
function sheet(title,fields,onSave,onDelete,extra=''){
  SHEET={fields,onSave,onDelete};
  const f=fields.map(x=>{
    if(x.type==='html')return x.html;
    const v=x.value??'';
    let inp;
    if(x.type==='textarea')inp=`<textarea class="field" name="${x.name}" placeholder="${esc(x.ph||'')}">${esc(v)}</textarea>`;
    else if(x.type==='select')inp=`<select class="field" name="${x.name}">${x.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(x.type==='multi'){const on=String(v).split('|');inp=`<div class="chips" data-multi="1">${x.options.map(o=>`<button type="button" class="${on.includes(o)?'on':''}" data-a="chip" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div><input type="hidden" name="${x.name}" value="${esc(v)}">`}
    else if(x.type==='chips')inp=`<div class="chips" data-chips="${x.name}">${x.options.map(([val,lab])=>`<button type="button" class="${String(val)===String(v)?'on':''}" data-a="chip" data-val="${esc(val)}">${lab}</button>`).join('')}</div><input type="hidden" name="${x.name}" value="${esc(v)}">`;
    else inp=`<input class="field" name="${x.name}" type="${x.type||'text'}" ${x.type==='number'?'inputmode="decimal" step="0.01"':''} value="${esc(v)}" placeholder="${esc(x.ph||'')}">`;
    return `<label>${x.label}</label>${inp}`;
  }).join('');
  document.getElementById('overlay').innerHTML=`<div class="scrim" data-a="closeSheet"><form class="sheet" onsubmit="return false"><div class="grab"></div><h2>${title}</h2>${f}${extra}
    <div class="acts">${onDelete?`<button type="button" class="btn danger" data-a="sheetDel">${ic('trash')}</button>`:''}<button type="button" class="btn soft" data-a="closeSheet">Cancel</button><button type="submit" class="btn" data-a="sheetSave">Save</button></div></form></div>`;
  const first=document.querySelector('.sheet [name]:not([type=hidden])');if(first&&!fields[0].noFocus)setTimeout(()=>first.focus(),60);
}
function closeSheet(){document.getElementById('overlay').innerHTML='';SHEET=null;confirmFn=null}
function sheetVals(){const o={};document.querySelectorAll('.sheet [name]').forEach(e=>o[e.name]=e.value.trim());return o}

/* ---------- calendar file (.ics) ---------- */
function icsEsc(s){return String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n')}
function icsDate(d,t){return d.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'')}
function addMinT(t,m){const [h,mi]=t.split(':').map(Number);const x=h*60+mi+m;return pad(Math.floor(x/60)%24)+':'+pad(x%60)}
function downloadICS(file,events){
  const n=new Date();const stamp=`${n.getUTCFullYear()}${pad(n.getUTCMonth()+1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}00Z`;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Planner//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  events.forEach(e=>{
    L.push('BEGIN:VEVENT','UID:'+e.uid+'@my-planner','DTSTAMP:'+stamp);
    if(e.time){L.push('DTSTART:'+icsDate(e.date,e.time),'DTEND:'+icsDate(e.date,addMinT(e.time,30)))}
    else{L.push('DTSTART;VALUE=DATE:'+icsDate(e.date),'DTEND;VALUE=DATE:'+icsDate(addD(e.date,1)))}
    L.push('SUMMARY:'+icsEsc(e.title));
    if(e.desc)L.push('DESCRIPTION:'+icsEsc(e.desc));
    if(e.rrule)L.push('RRULE:'+e.rrule);
    if(e.alarm)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:'+e.alarm,'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.replace(/[^\w\- ]+/g,'').trim().slice(0,40)+'.ics';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('Open the downloaded file to add it to your calendar');
}

    alarm:rm===null?null:(t.time?(rm?`-PT${rm}M`:'PT0M'):'PT9H')};

function billEvent(b){

  return {uid:'bill-'+(b.id||uid()),date:nextBillDate(b),title:`${b.name} bill due (${money(num(b.amount))})`,desc:b.note||'',

}

/* ---------- reminders (while app is open) ---------- */
function billDueDate(b,ym){return `${ym}-${pad(Math.min(+b.day||1,daysIn(ym)))}`}
function dueReminders(){
  const t=today(),ym=ymOf(t),out=[];
  S.bills.forEach(b=>{
    [ym,addM(ym,1)].forEach(m=>{
      if(b.paid?.[m])return;
      const due=billDueDate(b,m), lead=b.remind===''||b.remind==null?3:+b.remind;
      const diff=dayDiff(t,due);
      if(diff>=0&&diff<=Math.max(lead,0))out.push({kind:'bill',b,due,diff,ym:m});
    });
  });
  S.tasks.filter(x=>!x.done&&x.date===t&&x.time).sort((a,b)=>a.time.localeCompare(b.time)).forEach(x=>out.push({kind:'task',t:x}));
  return out;
}
function notifyNow(title,body){
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.showNotification)r.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:title});else new Notification(title,{body})}).catch(()=>{try{new Notification(title,{body})}catch(e){}});
    }else new Notification(title,{body});
  }catch(e){}
}
function checkReminders(){
  if(!S.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  let sent={};try{sent=JSON.parse(localStorage.getItem(LS+'-sent')||'{}')}catch(e){}
  const now=new Date(),t=today();let changed=false;
  S.tasks.forEach(x=>{
    if(x.done||x.date!==t||!x.time||x.remind===''||x.remind==null)return;
    const [h,m]=x.time.split(':').map(Number);const due=P(t);due.setHours(h,m-(+x.remind||0),0,0);
    const key='t'+x.id+t+x.time;
    if(now>=due&&now-due<3*3600e3&&!sent[key]){notifyNow('⏰ '+x.text,(+x.remind?`Starts at ${x.time}`:`Now · ${x.time}`));sent[key]=1;changed=true}
  });
  if(now.getHours()>=9){dueReminders().filter(r=>r.kind==='bill'&&r.b.remind!==''&&r.b.remind!=null).forEach(r=>{
    const key='b'+r.b.id+r.due;if(sent[key])return;
    notifyNow('💸 '+r.b.name+' due '+(r.diff===0?'today':r.diff===1?'tomorrow':'on '+fmtD(r.due)),money(num(r.b.amount)));sent[key]=1;changed=true;
  })}
  const xd=exportDue();if(xd&&now.getHours()>=9&&!sent['x'+xd]){const n=MON[+xd.slice(5)-1];notifyNow('📊 Export '+n+'’s budget','Your '+n+' budget sheet is ready — open Money to export it.');sent['x'+xd]=1;changed=true}
  if(changed){const keep={};Object.keys(sent).slice(-300).forEach(k=>keep[k]=1);try{localStorage.setItem(LS+'-sent',JSON.stringify(keep))}catch(e){}}
}

/* ---------- period ---------- */
const SYMS=['Cramps','Headache','Bloating','Tired','Moody','Acne','Back pain','Cravings','Tender breasts','Nausea'];
function cycleInfo(){
  const c=S.period.cycles.slice().sort((a,b)=>a.start.localeCompare(b.start));
  const gaps=[];for(let i=1;i<c.length;i++){const g=dayDiff(c[i-1].start,c[i].start);if(g>=18&&g<=50)gaps.push(g)}
  const avgCycle=Math.round(mean(gaps.slice(-6)))||(+S.period.cycle||28);
  const lens=c.filter(x=>x.end).map(x=>dayDiff(x.start,x.end)+1).filter(x=>x>0&&x<15);
  const avgLen=Math.round(mean(lens.slice(-6)))||(+S.period.len||5);
  const last=c[c.length-1];const t=today();
  let next=null,status='',cday=null,onPeriod=false;
  if(last){
    cday=dayDiff(last.start,t)+1;
    onPeriod=!last.end&&cday<=12||(last.end&&t<=last.end&&t>=last.start);
    next=addD(last.start,avgCycle);while(next<t&&!onPeriod)next=addD(next,avgCycle);
    const inN=dayDiff(t,next);
    status=onPeriod?`Period · day ${cday}`:inN===0?'Period may start today':inN<0?`${-inN} day${inN===-1?'':'s'} late`:`Next period in ~${inN} day${inN===1?'':'s'}`;
  }
  return {c,avgCycle,avgLen,last,next,status,cday,onPeriod};
}
function isPeriodDay(d,info){return info.c.some(x=>{const end=x.end||(d<=today()?addD(x.start,Math.max(info.avgLen,1)-1):x.start);return d>=x.start&&d<=(x.end?x.end:(x===info.last&&info.onPeriod?today():end))})}
function vPeriod(){
  const info=cycleInfo(),ym=U.perM||ymOf(today()),t=today();
  const pred=new Set();if(info.next)for(let k=0;k<3;k++){const s=addD(info.next,k*info.avgCycle);for(let i=0;i<info.avgLen;i++)pred.add(addD(s,i))}
  const cells=monthGrid(ym).map(d=>{if(!d)return '<div></div>';const p=isPeriodDay(d,info),pr=!p&&pred.has(d)&&d>=t,lg=S.period.days[d];
    return `<button class="d pd ${p?'per':''} ${pr?'pred':''} ${d===t?'today':''}" data-a="perDay" data-d="${d}">${+d.slice(8)}${lg&&(lg.flow||lg.sym?.length)?'<span class="dots"><i style="background:var(--lavD)"></i></span>':''}</button>`}).join('');
  return `${backBtn('life','Life')}
  <div class="paper" style="text-align:center">${band('pink','Period tracker')}
    ${info.last?`<div class="big" style="font-size:26px">${info.status}</div><div class="small muted" style="margin-top:4px">${info.next&&!info.onPeriod?'Estimated '+fmtLong(info.next)+' · ':''}Avg cycle ${info.avgCycle} days · period ${info.avgLen} days</div>`:'<div class="muted">Log your period to start seeing estimates.</div>'}
    <div class="row" style="justify-content:center;gap:8px;margin-top:14px">${info.onPeriod&&!info.last.end?`<button class="btn" data-a="perEnd">Period ended today</button>`:`<button class="btn" data-a="perStart">Period started today</button>`}<button class="btn soft" data-a="perDay" data-d="${t}">Log today</button></div>
  </div>
  <div class="paper"><div class="row between" style="margin-bottom:10px"><button class="iconbtn" data-a="perShift" data-n="-1">${ic('left')}</button><div class="title" style="font-size:19px">${fmtYM(ym)}</div><button class="iconbtn" data-a="perShift" data-n="1">${ic('right')}</button></div>
    <div class="cal">${DOW.map(x=>`<div class="dow">${x.toUpperCase()}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i style="background:var(--pinkD)"></i>Period</span><span><i style="background:var(--pink)"></i>Estimated</span><span><i style="background:var(--lavD)"></i>Symptoms logged</span></div>
    <p class="small muted" style="margin:10px 0 0">Estimates are based on your past cycles and are not medical advice or birth control.</p></div>
  <div class="paper">${band('lav','History')}${info.c.slice().reverse().slice(0,12).map(x=>`<button class="txrow" data-a="editCycle" data-s="${x.start}"><span class="grow"><b>${fmtLong(x.start)}</b><br><span class="small muted">${x.end?(dayDiff(x.start,x.end)+1)+' days':'Ongoing / no end logged'}</span></span></button>`).join('')||empty('No periods logged yet.')}
    <button class="linkbtn" style="margin-top:8px" data-a="addCycle">+ Add a past period</button></div>`;
}
function perDayForm(d){
  const lg=S.period.days[d]||{};
  sheet('Log · '+fmtLong(d),[
    {name:'flow',label:'Flow',type:'chips',options:[['','None'],['Spotting','Spotting'],['Light','Light'],['Medium','Medium'],['Heavy','Heavy']],value:lg.flow||'',noFocus:true},

    save('period')});
}

const OCR={w:null,loading:null,log:null};

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function ocrWorker(){

function loadImg(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}
function imgCanvas(img,max,minW=0){
  let k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  if(minW&&img.naturalWidth*k<minW)k=Math.min(2.5,minW/img.naturalWidth);
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;
}
/* grayscale + contrast stretch helps with faded thermal paper */
function ocrPrep(img){
  const c=imgCanvas(img,2200,1100),x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data,h=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=g;h[g]++}
  const n=p.length/4;let lo=0,hi=255,acc=0;while(lo<255&&(acc+=h[lo])<n*.02)lo++;acc=0;while(hi>0&&(acc+=h[hi])<n*.02)hi--;
  const r=Math.max(1,hi-lo);
  for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(p[i]-lo)*255/r));p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(d,0,0);return c;
}

/* ---- pull amount / date / shop out of the text ---- */
function rcAmounts(line){const re=/(\d{1,3}(?:,\d{3})+|\d+)\s?[.,]\s?(\d{2})(?![\d%])/g,o=[];let m;while((m=re.exec(line)))o.push(parseFloat(m[1].replace(/,/g,'')+'.'+m[2]));return o}
function rcTotal(lines){
  const strong=/grand\s*total|rounded\s*total|total\s*(after\s*)?round|nett?\s*total|total\s*nett?|amount\s*(due|payable)|total\s*(payable|due|amount)|jumlah\s*(besar|bersih|perlu\s*dibayar)/i;
  const mid=/total\s*(incl|inc\b|\(rm\)|rm\b|sales|bill|price)|jumlah|\btotal\s*:/i;
  const weak=/\btota[l1i]\b|\bt[o0]tal/i;
  const not=/sub\s*-?\s*tota[l1]|total\s*(qty|quantity|items?|item\s*count|disc|discount|savings?|saved|excl|before|tax|sst|gst|service)|tax\s*total|items?\s*total/i;
  let best=null;
  lines.forEach((l,i)=>{
    if(not.test(l))return;
    const rank=strong.test(l)?3:mid.test(l)?2:weak.test(l)?1:0;if(!rank)return;
    let a=rcAmounts(l);if(!a.length&&lines[i+1])a=rcAmounts(lines[i+1]);
    if(!a.length)return;const v=a[a.length-1];
    if(v>0&&v<100000&&(!best||rank>=best.rank))best={rank,v};
  });
  if(best)return best.v;
  const skip=/cash|tunai|change|baki|tender|paid|bayar|card|visa|master|debit|credit|qr|ewallet|tng|rounding|pembundaran|tel|phone|no[.:]|gst\s*id|sst\s*id|reg/i;
  let max=0;lines.forEach(l=>{if(skip.test(l))return;rcAmounts(l).forEach(v=>{if(v<100000&&v>max)max=v})});
  return max||null;
}
function rcDate(text){
  const MO={jan:1,feb:2,mar:3,apr:4,may:5,mei:5,jun:6,jul:7,aug:8,ogo:8,sep:9,oct:10,okt:10,nov:11,dec:12,dis:12};
  const t=today(),lo=addD(t,-730),hi=addD(t,1),out=[];
  const ok=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<100)y+=2000;if(m<1||m>12||d<1||d>daysIn(y+'-'+pad(m)))return null;const s=`${y}-${pad(m)}-${pad(d)}`;return s>=lo&&s<=hi?s:null};
  let m;const R=[
    [/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g,x=>ok(x[1],x[2],x[3])],
    [/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})\b/g,x=>ok(x[3],x[2],x[1])||ok(x[3],x[1],x[2])],
    [/\b(\d{1,2})[\s\-\/.]*([A-Za-z]{3,9})[\s\-\/.,]*(\d{4}|\d{2})\b/g,x=>MO[x[2].slice(0,3).toLowerCase()]?ok(x[3],MO[x[2].slice(0,3).toLowerCase()],x[1]):null],
    [/\b([A-Za-z]{3,9})[\s.]+(\d{1,2}),?\s+(\d{4})\b/g,x=>MO[x[1].slice(0,3).toLowerCase()]?ok(x[3],MO[x[1].slice(0,3).toLowerCase()],x[2]):null]
  ];
  R.forEach(([re,f])=>{while((m=re.exec(text))){const v=f(m);if(v)out.push([m.index,v])}});
  out.sort((a,b)=>a[0]-b[0]);return out.length?out[0][1]:null;
}
function rcShop(lines){
  const junk=/receipt|resit|invoice|inv\b|tax|welcome|selamat|thank|tel\b|tel[:.]|phone|fax|www|http|@|gst|sst|reg\b|reg[.:]|no[.:]|cashier|kasir|date|time|table|order|bill\b|counter|pos\b|jalan|jln|lot\b|taman|tmn|\b\d{5}\b/i;
  for(const raw of lines.slice(0,6)){
    let l=raw.replace(/\(.*?\)/g,' ').replace(/\b(sdn\.?\s*bhd\.?|bhd\.?|plt|co\.|co\b|enterprise|trading|kuching|sarawak|malaysia|miri|sibu|bintulu|samarahan|kuala\s*lumpur)(?=\W|$)/gi,' ').replace(/[^A-Za-z0-9&'.\- ]+/g,' ').replace(/\s+/g,' ').trim();
    const letters=(l.match(/[A-Za-z]/g)||[]).length;
    if(letters<3||letters/l.length<.6||junk.test(raw))continue;
    if(l===l.toUpperCase())l=l.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
    return l.slice(0,40);
  }
  return '';
}
function rcCategory(text){
  const map=[
    ['Transport',/grab|petronas|shell|petron|caltex|bhp|parking|touch\s*'?n\s*go|tng|toll|lrt|mrt|bas\b|airasia|mas\s*airlines/i],
    ['Groceries',/aeon|lotus|tesco|mydin|giant|jaya\s*grocer|speedmart|econsave|tf\s*value|everrise|choice\s*mart|village\s*grocer|hero\s*market|cold\s*storage|supermarket|pasaraya|mart\b/i],
    ['Food & Dining',/tealive|zus|starbucks|mcdonald|mcd\b|kfc|marrybrown|domino|pizza|subway|texas|sushi|restoran|restaurant|cafe|caf[eé]|kopitiam|bakery|coffee|kopi|food|nasi|mee|laksa|dine|kitchen|chatime|secret\s*recipe|family\s*mart|7-?eleven/i],
    ['Health',/guardian|watsons|pharmacy|farmasi|klinik|clinic|hospital|dental|caring|big\s*pharmacy|alpro/i],
    ['Bills & Utilities',/tnb|tenaga|sesco|syabas|kwb|unifi|maxis|celcom|digi|u\s*mobile|astro|time\s*internet|indah\s*water/i],
    ['Shopping',/shopee|lazada|uniqlo|h&m|zara|mr\s*diy|daiso|ikea|popular|mph|harvey|courts|senheng|switch|machines|kkv|miniso|padini|cotton\s*on/i],
    ['Personal Care',/salon|barber|spa\b|nail|beauty|sephora/i],
    ['Entertainment',/gsc|tgv|mbo|cinema|karaoke|bowling|netflix|spotify|steam/i]
  ];
  for(const [c,re] of map)if(S.cats.out.includes(c)&&re.test(text))return c;
  return '';
}
function parseReceipt(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  return {amount:rcTotal(lines),date:rcDate(text),shop:rcShop(lines),cat:rcCategory(text)};
}

function setField(name,val){const el=document.querySelector(`.sheet [name=${name}]`);if(!el||val==null||val==='')return false;if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===val))return false;el.value=val;el.classList.add('filled');setTimeout(()=>el.classList.remove('filled'),1600);return true}
async function rcHandleFile(file){
  const rc=RC;if(!rc||!file)return;
  let img;try{img=await loadImg(file)}catch(e){return toast('Couldn’t open that photo')}
  rc.data=imgCanvas(img,1300).toDataURL('image/jpeg',.62);rc.removed=false;rcRedraw();
  rcStatus('<span class="spin"></span> Reading receipt…');
  OCR.log=m=>{if(RC!==rc)return;if(m.status&&/load|initial/i.test(m.status)&&!OCR.w)rcStatus('<span class="spin"></span> Getting the receipt reader ready (first time only)…');else if(m.status==='recognizing text')rcStatus(`<span class="spin"></span> Reading receipt… ${Math.round((m.progress||0)*100)}%`)};
  try{
    const w=await ocrWorker();

    if(RC!==rc)return;
    OCR.last=data.text||'';const r=parseReceipt(OCR.last);
    const typeEl=document.querySelector('.sheet [name=type]');
    if(typeEl&&typeEl.value==='in'){const chip=document.querySelector('.sheet [data-chips=type] [data-val=out]');chip&&chip.click()}
    const got=[];
    if(r.amount&&setField('amount',r.amount.toFixed(2)))got.push('amount');
    if(r.date&&setField('date',r.date))got.push('date');
    const note=document.querySelector('.sheet [name=note]');if(r.shop&&note&&(!note.value||note.dataset.auto)){note.value=r.shop;note.dataset.auto=1;got.push('shop')}
    if(r.cat&&setField('cat',r.cat))got.push('category');
    if(!r.amount)rcStatus('Couldn’t find the total — please type the amount. The photo is still attached.','money-out');
    else rcStatus('✓ Filled in '+got.join(', ')+' from the receipt. Check it’s right, then Save.','money-in');
  }catch(e){
    if(RC!==rc)return;
    rcStatus(navigator.onLine?'Couldn’t read this receipt. Type the details in — the photo is still attached.':'The receipt reader needs internet the first time it’s used. The photo is still attached — type the details in for now.','money-out');
  }
}

/* ---------- Excel export (budget) ---------- */
const XL={
  esc:s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
  col:i=>{let s='',n=i+1;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s},
  serial:d=>{const [y,m,dd]=d.split('-').map(Number);return (Date.UTC(y,m-1,dd)-Date.UTC(1899,11,30))/864e5},
  q:n=>`'${n.replace(/'/g,"''")}'`
};
const xT=(v,s=0)=>({t:'s',v:String(v??''),s});
const xN=(v,s=2)=>({t:'n',v:num(v),s});
const xD=d=>d?{t:'n',v:XL.serial(d),s:3}:xT('');
const xF=(f,cache,s=2)=>({t:'f',f,cache,s});
function xSheet(wb,name,widths){const sh={name:name.replace(/[\[\]:*?\/\\]/g,'').slice(0,31),widths,rows:[],cf:[]};wb.push(sh);return sh}
const xRow=(sh,cells=[])=>{sh.rows.push(cells);return sh.rows.length};
const xNext=sh=>sh.rows.length+1;
const xRef=(sh,c,r)=>`${XL.q(sh.name)}!$${c}$${r}`;
const xRng=(sh,c,a,b)=>`${XL.q(sh.name)}!$${c}$${a}:$${c}$${b}`;
const xHead=(sh,title)=>{if(sh.rows.length){xRow(sh);xRow(sh)}xRow(sh,[xT(title,6)])};
const xCols=(sh,labels)=>xRow(sh,labels.map(l=>xT(l,1)));
const monLabel=ym=>MON[+ym.slice(5)-1]+' '+ym.slice(0,4);
const sumLog=(log,from,to)=>(log||[]).filter(l=>(!from||(l.date&&l.date>=from))&&(!to||!l.date||l.date<=to)).reduce((a,l)=>a+num(l.amt),0);

/* writes one month; stacked = all sections on one tab (year file) */
function xlMonth(wb,ym,stacked){
  const W={sum:[28,18],bud:[24,16,16,16,12],tx:[14,12,20,30,16,10],bill:[24,16,16,12,28],save:[24,18,18,18,16,12,16]};
  const one=stacked?xSheet(wb,MON[+ym.slice(5)-1].slice(0,3),[26,18,18,18,18,14,16]):null;
  const tab=(name,w)=>one||xSheet(wb,name,w);
  const R={},V={};
  const b=budgetOf(ym), end=ym+'-'+pad(daysIn(ym)), start=ym+'-01';
  const list=txIn(ym).slice().sort((a,c)=>a.date.localeCompare(c.date)||(a.created||0)-(c.created||0));
  const spent=sumOut(list), inc=sumIn(list);
  const byCat={};list.filter(t=>t.type!=='in').forEach(t=>{const c=t.cat||'Others';byCat[c]=(byCat[c]||0)+num(t.amount)});
  const cats=[...S.cats.out];[...Object.keys(b.plan||{}),...Object.keys(byCat)].forEach(c=>{if(!cats.includes(c)&&(num(b.plan?.[c])||byCat[c]))cats.push(c)});
  const planned=cats.reduce((a,c)=>a+num(b.plan?.[c]),0);
  const bills=S.bills.slice().sort((a,c)=>(+a.day)-(+c.day));
  const billTot=bills.reduce((a,x)=>a+num(x.amount),0), billPaid=bills.filter(x=>x.paid?.[ym]).reduce((a,x)=>a+num(x.amount),0);
  const savedM=S.savings.reduce((a,s)=>a+sumLog(s.log,start,end),0), debtM=S.debts.reduce((a,d)=>a+sumLog(d.log,start,end),0);
  Object.assign(V,{exp:num(b.income),inc,plan:planned,spent,left:planned-spent,bal:inc-spent,saved:savedM,debt:debtM});

  /* 1. Summary */
  const s1=tab('Summary',W.sum);
  xRow(s1,[xT(stacked?monLabel(ym):'Budget summary — '+monLabel(ym),6)]);
  if(stacked)xRow(s1,[xT('Summary',9)]);
  xCols(s1,['Item','Amount']);
  const line=(label,cell,key)=>{const r=xRow(s1,[xT(label),cell]);if(key)R['s_'+key]=xRef(s1,'B',r);return r};
  line('Expected income',xN(b.income),'exp');
  line('Actual income',xF(()=>R.inc,inc),'inc');
  line('Planned budget',xF(()=>R.plan,planned),'plan');
  line('Total spent',xF(()=>R.spent,spent),'spent');
  const rl=line('Budget left',xF(()=>`${R.plan}-${R.spent}`,planned-spent),'left');
  const rb=line('Balance (income − spent)',xF(()=>`${R.inc}-${R.spent}`,inc-spent),'bal');
  line('Bills paid',xF(()=>R.billsPaid,billPaid));
  line('Bills still to pay',xF(()=>R.billsLeft,billTot-billPaid));
  line('Saved this month',xF(()=>R.saved,savedM),'saved');
  line('Debt paid this month',xF(()=>R.debtPaid,debtM),'debt');
  s1.cf.push({ref:`B${rl}:B${rb}`,op:'lessThan',val:'0'});
  if(!stacked){xRow(s1);xRow(s1,[xT('Exported from My Planner on '+fmtLong(today())+'. Edit amounts in the other tabs and these totals update.',8)])}

  /* 2. Budget vs actual */
  const s2=tab('Budget vs actual',W.bud);
  xHead(s2,stacked?'Budget vs actual':'Budget vs actual — '+monLabel(ym));
  xCols(s2,['Category','Planned','Spent','Left','% used']);
  const b1=xNext(s2);
  cats.forEach(c=>{const r=xNext(s2),pl=num(b.plan?.[c]),sp=byCat[c]||0;
    xRow(s2,[xT(c),xN(pl),xF(()=>`SUMIFS(${R.txAmt},${R.txType},"Spending",${R.txCat},A${r})`,sp),xF(`B${r}-C${r}`,pl-sp),xF(`IF(B${r}=0,"",C${r}/B${r})`,pl?sp/pl:'',7)])});
  const b2=Math.max(b1,xNext(s2)-1), bt=xNext(s2);
  xRow(s2,[xT('Total',4),xF(`SUM(B${b1}:B${b2})`,planned,5),xF(`SUM(C${b1}:C${b2})`,spent,5),xF(`B${bt}-C${bt}`,planned-spent,5),xF(`IF(B${bt}=0,"",C${bt}/B${bt})`,planned?spent/planned:'',10)]);
  R.plan=xRef(s2,'B',bt);
  s2.cf.push({ref:`D${b1}:D${bt}`,op:'lessThan',val:'0'});

  /* 3. Transactions */
  const s3=tab('Transactions',W.tx);
  xHead(s3,stacked?'Transactions':'Transactions — '+monLabel(ym));
  xCols(s3,['Date','Type','Category','Note','Amount','Receipt']);
  const t1=xNext(s3);
  list.forEach(t=>xRow(s3,[xD(t.date),xT(t.type==='in'?'Income':'Spending'),xT(t.cat||''),xT(t.note||''),xN(t.amount),xT(t.rc?'Yes':'')]));
  if(!list.length)xRow(s3,[xT('No entries this month',8)]);
  const t2=xNext(s3)-1;
  R.txAmt=xRng(s3,'E',t1,t2);R.txType=xRng(s3,'B',t1,t2);R.txCat=xRng(s3,'C',t1,t2);
  let r=xRow(s3,[xT('Total spending',4),xT('',4),xT('',4),xT('',4),xF(`SUMIFS(E${t1}:E${t2},B${t1}:B${t2},"Spending")`,spent,5)]);R.spent=xRef(s3,'E',r);
  r=xRow(s3,[xT('Total income',4),xT('',4),xT('',4),xT('',4),xF(`SUMIFS(E${t1}:E${t2},B${t1}:B${t2},"Income")`,inc,5)]);R.inc=xRef(s3,'E',r);

  /* 4. Bills & subscriptions */
  const s4=tab('Bills & subs',W.bill);
  xHead(s4,stacked?'Bills':'Bills — '+monLabel(ym));
  xCols(s4,['Bill','Due date','Amount','Paid?','Note']);
  const l1=xNext(s4);
  bills.forEach(x=>xRow(s4,[xT(x.name),xD(billDueDate(x,ym)),xN(x.amount),xT(x.paid?.[ym]?'Yes':'No'),xT(x.note||'')]));
  if(!bills.length)xRow(s4,[xT('No bills added',8)]);
  const l2=xNext(s4)-1;
  if(bills.length)s4.cf.push({ref:`D${l1}:D${l2}`,op:'equal',val:'"No"'});
  const lt=xRow(s4,[xT('Total bills',4),xT('',4),xF(`SUM(C${l1}:C${l2})`,billTot,5)]);
  const lp=xRow(s4,[xT('Paid',4),xT('',4),xF(`SUMIFS(C${l1}:C${l2},D${l1}:D${l2},"Yes")`,billPaid,5)]);
  const lr=xRow(s4,[xT('Still to pay',4),xT('',4),xF(`C${lt}-C${lp}`,billTot-billPaid,5)]);
  R.billsPaid=xRef(s4,'C',lp);R.billsLeft=xRef(s4,'C',lr);
  xHead(s4,'Subscriptions');
  xCols(s4,['Service','Billing','Amount','Per month','Renews']);
  const u1=xNext(s4);
  const subs=S.subs.slice().sort((a,c)=>(a.renew||'9').localeCompare(c.renew||'9'));
  subs.forEach(s=>{const r=xNext(s4),yr=s.cycle==='yearly';xRow(s4,[xT(s.name),xT(yr?'Yearly':'Monthly'),xN(s.amount),xF(`IF(B${r}="Yearly",C${r}/12,C${r})`,yr?num(s.amount)/12:num(s.amount)),xD(s.renew)])});
  if(!subs.length)xRow(s4,[xT('No subscriptions added',8)]);
  const u2=xNext(s4)-1, subM=subs.reduce((a,s)=>a+(s.cycle==='yearly'?num(s.amount)/12:num(s.amount)),0);
  const ut=xRow(s4,[xT('Total per month',4),xT('',4),xT('',4),xF(`SUM(D${u1}:D${u2})`,subM,5)]);
  xRow(s4,[xT('Total per year',4),xT('',4),xT('',4),xF(`D${ut}*12`,subM*12,5)]);

  /* 5. Savings & debts */
  const s5=tab('Savings & debts',W.save);
  xHead(s5,stacked?'Savings':'Savings — '+monLabel(ym));
  xCols(s5,['Goal','Target','Saved this month','Saved so far','Remaining','% reached','Target date']);
  const v1=xNext(s5);
  S.savings.forEach(s=>{const r=xNext(s5),tg=num(s.target),so=sumLog(s.log,null,end);
    xRow(s5,[xT(s.name),xN(tg),xN(sumLog(s.log,start,end)),xN(so),xF(`B${r}-D${r}`,tg-so),xF(`IF(B${r}=0,"",D${r}/B${r})`,tg?so/tg:'',7),xD(s.deadline)])});
  if(!S.savings.length)xRow(s5,[xT('No savings goals added',8)]);
  const v2=xNext(s5)-1, vt=xNext(s5);
  const svT=S.savings.reduce((a,s)=>a+num(s.target),0), svSo=S.savings.reduce((a,s)=>a+sumLog(s.log,null,end),0);
  xRow(s5,[xT('Total',4),xF(`SUM(B${v1}:B${v2})`,svT,5),xF(`SUM(C${v1}:C${v2})`,savedM,5),xF(`SUM(D${v1}:D${v2})`,svSo,5),xF(`SUM(E${v1}:E${v2})`,svT-svSo,5),xF(`IF(B${vt}=0,"",D${vt}/B${vt})`,svT?svSo/svT:'',10)]);
  R.saved=xRef(s5,'C',vt);
  xHead(s5,'Debts');
  xCols(s5,['Debt','Starting balance','Paid this month','Paid so far','Remaining','Monthly payment','Interest %']);
  const d1=xNext(s5);
  S.debts.forEach(d=>{const r=xNext(s5),bal=num(d.balance),so=sumLog(d.log,null,end);
    xRow(s5,[xT(d.name),xN(bal),xN(sumLog(d.log,start,end)),xN(so),xF(`B${r}-D${r}`,bal-so),d.min?xN(d.min):xT(''),d.rate!==''&&d.rate!=null?xN(d.rate,0):xT('')])});
  if(!S.debts.length)xRow(s5,[xT('No debts added',8)]);
  const d2=xNext(s5)-1, dbT=S.debts.reduce((a,d)=>a+num(d.balance),0), dbSo=S.debts.reduce((a,d)=>a+sumLog(d.log,null,end),0);
  const dt=xRow(s5,[xT('Total',4),xF(`SUM(B${d1}:B${d2})`,dbT,5),xF(`SUM(C${d1}:C${d2})`,debtM,5),xF(`SUM(D${d1}:D${d2})`,dbSo,5),xF(`SUM(E${d1}:E${d2})`,dbT-dbSo,5)]);
  R.debtPaid=xRef(s5,'C',dt);
  xRow(s5);xRow(s5,[xT('“So far” amounts count everything up to the end of '+monLabel(ym)+'.',8)]);
  return {R,V};
}

function xlYear(y){
  const cur=ymOf(today()), last=y===cur.slice(0,4)?+cur.slice(5):12;
  const head=[], months=[], out=[];
  const sum=xSheet(head,'Year summary',[14,17,16,16,16,16,18,16,16]);
  for(let m=1;m<=last;m++)out.push([y+'-'+pad(m),xlMonth(months,y+'-'+pad(m),true)]);
  xRow(sum,[xT('Budget summary — '+y,6)]);
  xCols(sum,['Month','Expected income','Actual income','Budget','Spent','Budget left','Balance','Saved','Debt paid']);
  const keys=['exp','inc','plan','spent','left','bal','saved','debt'];
  const r1=xNext(sum);
  out.forEach(([ym,{R,V}])=>xRow(sum,[xT(MON[+ym.slice(5)-1]),...keys.map(k=>xF(()=>R['s_'+k],V[k]))]));
  const r2=xNext(sum)-1;
  xRow(sum,[xT('Total',4),...keys.map((k,i)=>{const c=XL.col(i+1);return xF(`SUM(${c}${r1}:${c}${r2})`,out.reduce((a,[,o])=>a+o.V[k],0),5)})]);
  sum.cf.push({ref:`F${r1}:G${r2+1}`,op:'lessThan',val:'0'});
  xRow(sum);xRow(sum,[xT('Each month has its own tab with the budget, transactions, bills, savings and debts. Exported '+fmtLong(today())+'.',8)]);
  return head.concat(months);
}

    {name:'[Content_Types].xml',data:`${H}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${wb.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/></Types>`},
    {name:'_rels/.rels',data:`${H}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`${H}<workbook ${NS}><bookViews><workbookView/></bookViews><sheets>${wb.map((s,i)=>`<sheet name="${XL.esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`${H}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wb.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId${n+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:xlStyles()},
    ...sheets.map((x,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:x})),
    {name:'xl/sharedStrings.xml',data:`${H}<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${strs.length}" uniqueCount="${strs.length}">${strs.map(s=>`<si><t xml:space="preserve">${XL.esc(s)}</t></si>`).join('')}</sst>`}
  ];
  return zipStore(files);
}

function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const T=XL.crc||(XL.crc=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})());
  const crc=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=T[(c^d[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
  const now=new Date(),tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(const f of files){
    const nm=enc.encode(f.name),data=enc.encode(f.data),c=crc(data);
    const h=new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,tm,2],[12,dt,2],[14,c,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    parts.push(new Uint8Array(h.buffer),nm,data);
    const cd=new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,tm,2],[14,dt,2],[16,c,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[42,off,4]].forEach(([o,v,s])=>s===4?cd.setUint32(o,v,true):cd.setUint16(o,v,true));
    central.push(new Uint8Array(cd.buffer),nm);
    off+=30+nm.length+data.length;
  }
  const size=central.reduce((a,p)=>a+p.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function deliverXlsx(blob,name,onDone){
  const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);onDone();toast('Excel file saved — open it in Google Sheets')};
  let file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(()=>{onDone();toast('Excel file ready ✨')}).catch(e=>{if(e&&e.name==='AbortError')return;dl()});
  }else dl();
}
function markExported(yms){S.settings.exported=S.settings.exported||{};yms.forEach(m=>S.settings.exported[m]=1);save('settings');render()}
function exportMonth(ym){const wb=[];xlMonth(wb,ym,false);deliverXlsx(xlBuild(wb),`budget-${ym}.xlsx`,()=>markExported([ym]))}
function exportYear(y){const wb=xlYear(y),cur=ymOf(today()),last=y===cur.slice(0,4)?+cur.slice(5):12,yms=[];for(let m=1;m<=last;m++)yms.push(y+'-'+pad(m));deliverXlsx(xlBuild(wb),`budget-${y}.xlsx`,()=>markExported(yms))}
/* month to nudge about: last month, if it has money data and hasn't been exported or skipped */
function exportDue(){
  const prev=addM(ymOf(today()),-1);
  if(!(txIn(prev).length||S.budgets[prev]))return null;
  if((S.settings.exported||{})[prev]||S.settings.exportSkip===prev)return null;
  return prev;
}
function exportBanner(){
  const m=exportDue();if(!m)return '';const n=MON[+m.slice(5)-1];
  return `<div class="paper" style="border:1.5px dashed var(--peachD)"><div class="row" style="gap:10px;align-items:flex-start"><span style="font-size:22px;line-height:1">📊</span><div class="grow"><b>${n} is done!</b><div class="small muted" style="margin:2px 0 10px">Export ${n}’s budget to Excel so you have a copy.</div><div class="row" style="gap:8px"><button class="btn sm" data-a="xlsPrev">Export ${n}</button><button class="btn sm soft" data-a="xlsSkip">Not now</button></div></div></div></div>`;
}
function exportCard(ym){
  const y=ym.slice(0,4),done=(S.settings.exported||{})[ym];
  return `<div class="paper">${band('mint','Export to Excel')}
    <p class="small muted" style="margin-top:0">Get a spreadsheet of your budget, spending, bills, savings and debts. Opens in Google Sheets or Excel.${done?' <b>✓ Exported</b>':''}</p>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="xlsMonth">This month (${MON[+ym.slice(5)-1]})</button><button class="btn sm soft" data-a="xlsYear">Whole year ${y}</button></div>
  </div>`;
}
Object.assign(A,{
  xlsMonth:()=>exportMonth(U.mm),
  xlsYear:()=>exportYear(U.mm.slice(0,4)),
  xlsPrev:()=>{const m=exportDue();if(m)exportMonth(m)},
  xlsSkip:()=>{S.settings.exportSkip=addM(ymOf(today()),-1);save('settings');render()},
});

  waterSet:(e,d)=>{S.water.log[d.d]=+d.n;save('water');render()},

  perEnd:()=>{const i=cycleInfo();if(i.last){i.last.end=today();save('period');render()}},

  packUncheck:(e,d)=>{const o=packOwner(d.o);if(o){o.list.forEach(x=>x.done=false);save(o.key);render()}},

  pickPhotos:()=>document.getElementById('visionFile').click(),
  newWords:()=>wordsForm(),
  editVision:(e,d)=>{const v=find(S.vision,d.id);if(!v)return;v.kind==='photo'?photoForm(v):wordsForm(v)},

  revRate:(e,d)=>{const r=S.reviews[d.w]||(S.reviews[d.w]={});r.rating=+d.n;save('reviews');render()},
  revGo:(e,d)=>{U.revWk=d.w;render();scrollTo(0,0)},
  weekReview:()=>{U.revWk=U.wk;go('review')},
  icsTask:()=>{const v=sheetVals();if(!v.text)return toast('Add a task name first');if(!v.date)return toast('Pick a date first');downloadICS(v.text,[taskEvent({...v,id:SHEET&&SHEET.itemId})])},
  icsBill:()=>{const v=sheetVals();if(!v.name)return toast('Name the bill first');downloadICS(v.name+' bill',[billEvent({...v,id:SHEET&&SHEET.itemId})])},
  icsAllBills:()=>{if(!S.bills.length)return toast('No bills yet');downloadICS('My bills',S.bills.map(billEvent))},
  notifyToggle:async()=>{
    if(S.settings.notify){S.settings.notify=false;save('settings');render();return}
    if(!('Notification' in window))return toast('This browser can’t show alerts — use “Add to phone calendar” instead');
    let p=Notification.permission;if(p==='default'){try{p=await Notification.requestPermission()}catch(e){}}
    if(p!=='granted')return toast('Alerts are blocked — allow notifications for this site in your phone settings');
    S.settings.notify=true;save('settings');render();notifyNow('Alerts are on ✨','You’ll get task and bill reminders while the planner is open.');
  },
});
